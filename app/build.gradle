 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'io.freefair.lombok' version "8.14.2"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    implementation libs.jackson.databind
    implementation libs.jackson.csv
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'online.davisfamily.threedee.SoftwareRenderer'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.register('dspFullDayAnalysis', JavaExec) {
    group = 'application'
    description = 'Run one headless DSP full-day analysis.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'online.davisfamily.warehouse.sim.dsp.analysis.DspFullDayAnalysisMain'
}

tasks.register('dspP2pHistoryScaling', JavaExec) {
    group = 'verification'
    description = 'Run the opt-in synthetic P2P retained-history scaling diagnostic.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'online.davisfamily.warehouse.sim.dsp.p2p.lease.P2pHistoryScalingProbe'
    workingDir = rootProject.projectDir
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    jvmArgs '-Xms256m', '-Xmx512m'
}
